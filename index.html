<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Emmie</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/transition.js"></script>  <!-- Transitions entre les pages (doit rester ici, dans le head) -->
  <link rel="stylesheet" href="assets/css/accueil.css">
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/accueil.js" defer></script>
</head>
<body>

  <!--
    PAGE D'ACCUEIL
    - Un clic n'importe où mène à la page suivante (avec une transition).
      → Pour changer la page de destination, modifie href="projets.html" juste en dessous.
      → Pour changer le sens de la transition, modifie data-direction="bas" (bas, haut, gauche, droite).
    - 2 blocs empilés : le DÉCOR (fond + décos, qui bougent avec la souris)
      puis le CONTENU (spécialité, PORTFOLIO, photo, nom).
    - data-profondeur = force de l'effet parallax
      0 = ne bouge pas · 0.2 = bouge un peu (loin) · 1 = bouge beaucoup (proche)
  -->
  <a class="accueil" href="projets.html" data-direction="bas">

    <!-- ######################## DÉCOR ######################## -->
    <div class="decor">

      <!-- ===== FOND =====
           srcset="..." → image pour TÉLÉPHONE (écran en hauteur)
           src="..."    → image pour ORDINATEUR (écran en largeur) -->
      <picture class="fond" data-profondeur="0.2">
        <source media="(orientation: portrait)" srcset="assets/images/accueil/fond-telephone.svg">
        <img src="assets/images/accueil/fond.svg" alt="" width="1920" height="1080" fetchpriority="high">
      </picture>

      <!-- ===== DÉCOS =====
           Dans style="..." : --x = position depuis la gauche · --y = depuis le haut · --taille = largeur
           Sur téléphone (facultatif) : --x-tel, --y-tel, --taille-tel
           Pour en ajouter une : copie la ligne d'exemple ci-dessous, colle-la après
           la fin de ce commentaire (la ligne avec la flèche), puis change l'image et la position.

           Exemple :
           <img class="deco" src="assets/images/accueil/ma-deco.png" alt="" width="300" height="300" style="--x: 75%; --y: 50%; --taille: 8%;" data-profondeur="0.6">
      -->

    </div>

    <!-- ######################## CONTENU ######################## -->
    <div class="contenu">

      <!-- ===== SPÉCIALITÉ + "PORTFOLIO" ===== -->
      <div class="titres">
        <p class="specialite zone" data-profondeur="0.4">Design d'interaction &amp; graphisme</p>  <!-- TEXTE À MODIFIER -->
        <h1 class="titre zone" data-profondeur="0.5">PORTFOLIO</h1>                               <!-- TEXTE À MODIFIER -->
      </div>

      <!-- ===== PHOTO + PRÉNOM NOM ===== -->
      <div class="carte" data-profondeur="0.8">
        <img class="photo" src="assets/images/accueil/photo.svg" alt="Photo d'Emmie" width="600" height="600">
        <p class="nom zone">Prénom Nom</p>                                  <!-- TEXTE À MODIFIER -->
      </div>

    </div>

  </a>

</body>
</html>
